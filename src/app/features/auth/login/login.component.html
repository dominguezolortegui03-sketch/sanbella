<div class="auth-container">
  <div class="sanbella-card">
    <h2>Bienvenido a Sanbella</h2>
    <p class="subtitle">Ingresa tus credenciales para continuar</p>

    <form class="login-form">
      <div class="form-group">
        <label>Correo Electrónico</label>
        <input type="email" class="input-sanbella" placeholder="correo@sanbella.com">
      </div>

      <div class="form-group">
        <label>Contraseña</label>
        <input type="password" class="input-sanbella" placeholder="********">
      </div>

      <div class="forgot-password">
        <a href="#">¿Olvidaste tu contraseña?</a>
      </div>

      <button type="submit" class="btn-sanbella">
        INICIAR SESIÓN
      </button>
    </form>

    <p class="register-link" style="margin-top: 25px;">
      ¿Aún no tienes cuenta? 
      <a routerLink="/register" class="link-sanbella">Regístrate gratis</a>
    </p>
  </div>
</div>
