<div class="auth-container fade-in">
  <div class="auth-card">
    <h2 class="auth-title">Identifícate ✨</h2>
    <p class="auth-subtitle">Ingresa tus credenciales de Sanbella</p>

    <div class="auth-form">
      <div class="form-group">
        <label>Correo Electrónico</label>
        <input type="email" 
               [(ngModel)]="emailIngresado" 
               placeholder="test@sanbella.com" 
               class="input-sanbella">
      </div>

      <div class="form-group">
        <label>Contraseña</label>
        <input type="password" 
               [(ngModel)]="passwordIngresado" 
               placeholder="••••••••" 
               class="input-sanbella">
      </div>

      <button (click)="onLogin()" class="btn-sanbella w-100 mt-20">
        ENTRAR
      </button>

      <div class="auth-footer">
        <p>¿Prueba de usuario? Usa el correo de test arriba v:</p>
      </div>
    </div>
  </div>
</div>
