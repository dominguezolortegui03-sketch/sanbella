<div class="module-container">
  <header class="module-header">
    <h1>Gestión de Usuarios</h1>
    <p>Administra los perfiles y roles de Sanbella</p>
  </header>

  <div class="action-bar">
    <button class="btn-primary" (click)="abrirModal()">+ Nuevo Usuario</button>
  </div>

  <div class="data-card">
    <table class="custom-table">
      <thead>
        <tr>
          <th>Usuario</th>
          <th>Rol</th>
          <th>Contacto</th>
          <th>Acciones</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let usuario of usuarios">
          <td class="user-cell">
            <div class="user-avatar">👤</div>
            <div class="user-info">
              <strong>{{ usuario.username }}</strong>
              <span>ID: {{ usuario.id }}</span>
            </div>
          </td>
          <td>
            <span class="badge" [ngClass]="{
              'badge-blue': usuario.rol === 'Cliente',
              'badge-purple': usuario.rol === 'Admin',
              'badge-orange': usuario.rol === 'Recepcionista'
            }">
              {{ usuario.rol }}
            </span>
          </td>
          <td>
            <div class="contact-info">
              <span style="display: block; font-size: 14px;">{{ usuario.email }}</span>
              <span style="font-size: 12px; color: #888;">{{ usuario.telefono }}</span>
            </div>
          </td>
          <td class="actions-cell">
            <button class="btn-icon edit" (click)="editarUsuario(usuario)">
              <i class="bi bi-pencil"></i>
            </button>
            <button class="btn-icon delete" (click)="eliminarUsuario(usuario.id)">
              <i class="bi bi-trash3"></i>
            </button>
          </td>
        </tr>
      </tbody>
    </table>
  </div>
</div>

<div class="modal-overlay" *ngIf="mostrarModal">
  <div class="modal-content">
    <div class="modal-header">
      <h2>{{ esEdicion ? 'Editar Usuario' : 'Nuevo Usuario' }}</h2>
      <button class="btn-close-x" (click)="cerrarModal()">&times;</button>
    </div>
    
    <form (ngSubmit)="registrarUsuario()">
      <div class="form-group">
        <label>Nombre de Usuario</label>
        <input type="text" name="username" [(ngModel)]="nuevoUsuario.username" required placeholder="Nombre">
      </div>

      <div class="form-group">
        <label>Rol</label>
        <select name="rol" [(ngModel)]="nuevoUsuario.rol">
          <option value="Cliente">Cliente</option>
          <option value="Admin">Admin</option>
          <option value="Recepcionista">Recepcionista</option>
        </select>
      </div>

      <div class="form-group">
        <label>Correo Electrónico</label>
        <input type="email" name="email" [(ngModel)]="nuevoUsuario.email" required placeholder="ejemplo@correo.com">
      </div>

      <div class="form-group">
        <label>Número de Teléfono</label>
        <input type="text" name="telefono" [(ngModel)]="nuevoUsuario.telefono" required placeholder="999 999 999">
      </div>

      <div class="modal-footer">
        <button type="button" class="btn-cancel-modal" (click)="cerrarModal()">Cancelar</button>
        <button type="submit" class="btn-save-modal">
          {{ esEdicion ? 'Actualizar Cambios' : 'Guardar Usuario' }}
        </button>
      </div>
    </form>
  </div>
</div>
