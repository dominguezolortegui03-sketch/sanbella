<div class="seguimiento-container">
  <header class="module-header">
    <h1>Módulo 2: Seguimiento</h1>
    <p>Monitorear y gestionar todas las citas</p>
  </header>

  <div class="filter-bar">
    <div class="filter-select">
      <i class="bi bi-funnel"></i>
      <select [(ngModel)]="filtroEstado" (change)="aplicarFiltro()">
        <option value="Todos">Todos los Estados</option>
        <option value="Pendiente">Pendiente</option>
        <option value="Completado">Completado</option>
        <option value="Cancelado">Cancelado</option>
      </select>
    </div>
  </div>

  <div class="table-card">
    <div class="table-header">
      <div class="header-col">Cliente</div>
      <div class="header-col">Servicio</div>
      <div class="header-col">Fecha y Hora</div>
      <div class="header-col">Especialista</div>
      <div class="header-col">Estado</div>
      <div class="header-col text-center">Acciones</div>
    </div>

    <div class="table-body">
      <div class="table-row" *ngFor="let cita of citasFiltradas">
        <div class="row-col"><strong>{{ cita.cliente }}</strong></div>
        <div class="row-col">{{ cita.servicio }}</div>
        <div class="row-col">{{ cita.fecha }}</div>
        <div class="row-col">{{ cita.especialista }}</div>
        <div class="row-col">
          <span class="status-badge" [ngClass]="cita.estado.toLowerCase()">
            {{ cita.estado }}
          </span>
        </div>
        <div class="row-col text-center actions">
          <button title="Ver Detalle"><i class="bi bi-eye"></i></button>
          <button title="Más Opciones"><i class="bi bi-three-dots-vertical"></i></button>
        </div>
      </div>

      <div class="empty-state" *ngIf="citasFiltradas.length === 0">
        <p>No se encontraron reservas para el estado: {{ filtroEstado }}</p>
      </div>
    </div>
  </div>
</div>
