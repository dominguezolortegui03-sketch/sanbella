<div class="module-container fade-in">
  <header class="module-header">
    <div class="header-content">
      <h1>Gestión de Clientes</h1>
      <p>Administra la base de datos de clientes de Sanbella</p>
    </div>
    
    <div class="header-actions">
      <button class="btn-filter-trigger" (click)="mostrarFiltros = true">
        <i class="bi bi-funnel"></i> Filtrar Búsqueda
      </button>
      <button class="btn-primary" (click)="abrirModal('nuevo')">
        <i class="bi bi-person-plus"></i> Nuevo Cliente
      </button>
    </div>
  </header>

  <div class="modal-overlay" *ngIf="mostrarFiltros" (click)="mostrarFiltros = false">
    <div class="filter-sidebar" [class.active]="mostrarFiltros" (click)="$event.stopPropagation()">
      <div class="filter-sidebar-header">
        <h2>Filtros</h2>
        <button class="close-btn" (click)="mostrarFiltros = false">&times;</button>
      </div>
      <div class="filter-body">
        <div class="filter-item">
          <label>Nombre Completo</label>
          <input type="text" placeholder="Buscar por nombre..." [(ngModel)]="filtros.nombre" class="filter-input">
        </div>
        <div class="filter-item">
          <label>N° Documento</label>
          <input type="text" placeholder="DNI, CE o Pasaporte..." [(ngModel)]="filtros.doc" class="filter-input">
        </div>
        <div class="filter-item">
          <label>Estado</label>
          <select [(ngModel)]="filtros.estado" class="filter-select">
            <option value="">Todos los Estados</option>
            <option value="Habilitado">Habilitado</option>
            <option value="Inhabilitado">Inhabilitado</option>
          </select>
        </div>
      </div>
      <div class="filter-footer">
        <button class="btn-reset" (click)="limpiarFiltros()">Limpiar</button>
        <button class="btn-apply" (click)="mostrarFiltros = false">Aplicar</button>
      </div>
    </div>
  </div>

  <div class="data-card">
    <table class="custom-table">
      <thead>
        <tr>
          <th>Acciones</th>
          <th>Nombre</th>
          <th>Apellido</th>
          <th>Doc.</th>
          <th>Contacto</th>
          <th>Estado</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let cliente of clientesFiltrados">
          <td class="actions-cell">
            <button class="btn-icon view" (click)="abrirModal('ver', cliente)" title="Ver">
              <i class="bi bi-eye"></i>
            </button>
            <button class="btn-icon edit" (click)="abrirModal('editar', cliente)" title="Editar">
              <i class="bi bi-pencil"></i>
            </button>
            <button class="btn-icon reset" (click)="restablecerPassword(cliente)" title="Clave">
              <i class="bi bi-key"></i>
            </button>
            <button class="btn-icon delete" (click)="toggleEstado(cliente)" 
                    [title]="cliente.Estado === 'Habilitado' ? 'Inhabilitar' : 'Habilitar'">
              <i class="bi" [ngClass]="cliente.Estado === 'Habilitado' ? 'bi-person-dash' : 'bi-person-check'"></i>
            </button>
          </td>
          <td><strong class="client-name">{{ cliente.Nombre }}</strong></td>
          <td>{{ cliente.Apellido }}</td>
          <td>
            <span class="doc-type">{{ cliente.TipoDocumento }}</span>
            <span class="doc-number">{{ cliente.NDocumento }}</span>
          </td>
          <td>
            <div class="contact-info">
              <span class="email-text">{{ cliente.correo }}</span>
              <span class="phone-text">{{ cliente.celular }}</span>
            </div>
          </td>
          <td>
            <span [class]="cliente.Estado === 'Habilitado' ? 'status-active' : 'status-inactive'">
              {{ cliente.Estado }}
            </span>
          </td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
