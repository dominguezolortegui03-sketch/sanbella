<div class="personal-container">
  <header class="header-section">
    <h1>Gestión de Personal</h1>
    <button class="btn-agregar">
      <i class="bi bi-plus"></i> Agregar Personal
    </button>
  </header>

  <div class="cards-grid">
    @for (persona of personal; track persona.nombre) {
      <div class="personal-card">
        <div class="card-top">
          <div class="avatar-circle">
            <i class="bi bi-person"></i>
          </div>
          <div class="info-texto">
            <h2>{{ persona.nombre }}</h2>
            <p class="puesto">{{ persona.puesto }}</p>
          </div>
        </div>

        <div class="horario-section">
          <h3>Horario Semanal</h3>
          <div class="horario-row">
            <span>{{ persona.horarioSemana.dias }}:</span>
            <span class="horas">{{ persona.horarioSemana.horas }}</span>
          </div>
          <div class="horario-row">
            <span>{{ persona.horarioFinSemana.dias }}:</span>
            <span class="horas">{{ persona.horarioFinSemana.horas }}</span>
          </div>
        </div>

        <div class="card-footer">
          <button class="btn-editar">Editar Horario</button>
        </div>
      </div>
    }
  </div>
</div>
