<div class="gestion-container">
  <header class="header-section">
    <h1>Gestión de Servicios</h1>
    <button class="btn-agregar">
      <i class="bi bi-plus"></i> Agregar Servicio
    </button>
  </header>

  <div class="table-card">
    <div class="table-responsive">
      <table>
        <thead>
          <tr>
            <th>Nombre</th>
            <th>Categoría</th>
            <th>Duración</th>
            <th>Precio</th>
            <th class="text-center">Acciones</th>
          </tr>
        </thead>
        <tbody>
          @for (servicio of servicios; track servicio.nombre) {
            <tr>
              <td>{{ servicio.nombre }}</td>
              <td>{{ servicio.categoria }}</td>
              <td>{{ servicio.duracion }}</td>
              <td>{{ servicio.precio }}</td>
              <td class="acciones-cell">
                <button class="btn-icon edit"><i class="bi bi-pencil-square"></i></button>
                <button class="btn-icon delete"><i class="bi bi-trash"></i></button>
              </td>
            </tr>
          }
        </tbody>
      </table>
    </div>
  </div>
</div>
